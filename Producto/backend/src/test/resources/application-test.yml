spring:
  datasource:
    url: jdbc:h2:mem:flowsense_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 25
    username: ''
    password: ''

app:
  jwt:
    secret: test-secret-min-32-chars-flowsense-test!!
    expiration-hours: 24
  cors:
    allowed-origins: http://localhost:5173
  frontend-url: http://localhost:5173
  mail:
    from: test@flowsense.cl
  upload-dir: /tmp/uploads
  results-dir: /tmp/results
  zones-dir: /tmp/zones
  python:
    bin: python3
    script: /tmp/detector.py

logging:
  level:
    root: WARN
    cl.duoc.flowsense: INFO
