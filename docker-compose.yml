services:

  mysql:
    image: mysql:8.0
    container_name: flowsense-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-flowsense_root}
      MYSQL_DATABASE: ${DB_NAME:-flowsense_db}
      MYSQL_USER: ${DB_USER:-flowsense}
      MYSQL_PASSWORD: ${DB_PASSWORD:-flowsense123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Producto/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - flowsense-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build: ./Producto/backend
    container_name: flowsense-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-flowsense_db}
      DB_USER: ${DB_USER:-flowsense}
      DB_PASSWORD: ${DB_PASSWORD:-flowsense123}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production_min_32_chars}
      JWT_EXPIRATION_HOURS: 24
      PYTHON_BIN: python3
      PYTHON_SCRIPT: /app/python/detector.py
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
      ZONES_DIR: /app/zones
      FRAMES_DIR: /app/frames
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./Producto/python:/app/python
      - uploads_data:/app/uploads
      - results_data:/app/results
      - zones_data:/app/zones
      - frames_data:/app/frames
    networks:
      - flowsense-net

  python:
    build: ./Producto/python
    container_name: flowsense-python
    restart: "no"
    volumes:
      - ./Producto/python:/app
      - uploads_data:/app/uploads
      - results_data:/app/results
      - zones_data:/app/zones
      - frames_data:/app/frames
    networks:
      - flowsense-net

  frontend:
    build: ./Producto/frontend
    container_name: flowsense-frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - flowsense-net

volumes:
  mysql_data:
  uploads_data:
  results_data:
  zones_data:
  frames_data:

networks:
  flowsense-net:
    driver: bridge